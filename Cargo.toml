[package]
name = "template-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
expect_used = "deny"
